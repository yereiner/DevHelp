[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devhelp"
version = "0.1.0"
description = "CLI para consulta de documentación técnica"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
devhelp = "src.main:main"

[tool.setuptools]
packages = ["src"]